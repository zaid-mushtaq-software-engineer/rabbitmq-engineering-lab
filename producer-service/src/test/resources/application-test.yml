spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  main:
    allow-bean-definition-overriding: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

lab:
  simulation:
    latency-min: 0ms
    latency-max: 0ms
