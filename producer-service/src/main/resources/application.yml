spring:
  application:
    name: producer-service
  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:lab_app}
    password: ${SPRING_RABBITMQ_PASSWORD:change_me_rabbit}
    publisher-confirm-type: correlated
    publisher-returns: true
  datasource:
    url: ${SPRING_DATASOURCE_PRODUCER_URL:jdbc:mysql://localhost:3306/notification_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_PRODUCER_USERNAME:lab_producer}
    password: ${SPRING_DATASOURCE_PRODUCER_PASSWORD:change_me_producer}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    defaults:
      enabled: true

lab:
  publisher:
    confirm-timeout: 5s
  api:
    default-page-size: 20
    max-page-size: 100
