spring:
  application:
    name: consumer-service
  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:lab_app}
    password: ${SPRING_RABBITMQ_PASSWORD:change_me_rabbit}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-docker
  datasource:
    url: ${SPRING_DATASOURCE_CONSUMER_URL:jdbc:mysql://localhost:3306/notification_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_CONSUMER_USERNAME:lab_consumer}
    password: ${SPRING_DATASOURCE_CONSUMER_PASSWORD:change_me_consumer}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when_authorized

lab:
  consumer:
    email:
      concurrency: 2
      max-concurrency: 4
      prefetch: 10
    sms:
      concurrency: 2
      max-concurrency: 4
      prefetch: 10
  retry:
    max-retries: 3
    delay: 10s
  simulation:
    enabled: true
    latency-min: 100ms
    latency-max: 500ms
